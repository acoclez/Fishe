# Workspace: the core (no window in it) and the desktop app built on it.
# See docs/architecture.md.
[workspace]
resolver = "3"
members = ["crates/fishe-core", "src-tauri"]

[workspace.package]
version = "0.16.0"
authors = ["Antoine Coclez"]
edition = "2024"
license = "MIT"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
