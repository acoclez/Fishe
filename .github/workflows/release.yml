# Builds the Windows installers and the Linux packages, and opens a GitHub
# release, when a version tag is pushed:
#
#   npm run version:set -- 0.16.0     # then write the CHANGELOG entry
#   git commit -am "Fishe 0.16.0"
#   git tag v0.16.0 && git push && git push --tags
#
# The release is created as a draft with the changelog entry as its notes;
# the two build jobs attach their files to it (.exe and .msi from Windows,
# .deb and .rpm from Linux). Look it over, then press Publish.
#
# Nothing is code-signed (see docs/development.md, Releases).
#
# This workflow can write to the repository's releases, so it takes nothing
# on trust: actions are pinned to a commit (see ci.yml), the Npcap SDK is
# checked against known hashes, dependencies come from Cargo.lock and
# package-lock.json exactly as committed, and no build cache is restored.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  # The tag is the release: it must name the version the files carry, and
  # that version must have its changelog entry. Opens the draft first, so
  # the two builds below attach to one release instead of racing to create it.
  draft:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Version and notes
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match the version in package.json ($version); run npm run version:set"
          }
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($cargo -ne $version) { throw "Cargo.toml is at $cargo, package.json at $version" }
          node scripts/release-notes.mjs $version | Out-File -Encoding utf8 release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "no changelog entry for $version" }
          "version=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      # A re-run finds the draft of the first attempt and keeps it.
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: Fishe ${{ steps.meta.outputs.version }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$TITLE" --notes-file release-notes.md

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        # Linux on the oldest supported runner: a package built there runs
        # on that distribution's C library and every newer one.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch

      # Build-time import libraries for the pcap crate. Npcap itself is not
      # shipped: users install it (the app tells them how).
      - name: Npcap SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-npcap-sdk.ps1

      # libpcap for capture, WebKitGTK and friends for the window.
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpcap-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev rpm

      - name: Install JS dependencies
        run: npm ci

      # The same checks as CI: a tag never releases what would not pass.
      # bash on both systems: it stops at the first command that fails.
      - name: Checks
        shell: bash
        run: |
          npm run check
          npm test
          cargo test --workspace --locked

      # Builds the frontend and the app in release mode, bundles the
      # packages of this system (NSIS and MSI, or deb and rpm: see
      # src-tauri/tauri.linux.conf.json) and attaches them to the draft.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Fishe ${{ needs.draft.outputs.version }}
          releaseDraft: true
          prerelease: false
