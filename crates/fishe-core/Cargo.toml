[package]
name = "fishe-core"
description = "Fishe's core: capture, measurement, recordings, probes and the MCP server, with no window in it"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON Schemas for the MCP tools' arguments (same version rmcp uses).
schemars = "1"
# Npcap on Windows, libpcap elsewhere.
pcap = "2.5"
thiserror = "2"
log = "0.4"
dns-lookup = "4"
rusqlite = { version = "0.41", features = ["bundled"] }
maxminddb = "0.32"
ureq = "3"
flate2 = "1"
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# The MCP server runs on its own small runtime (mcp/server.rs).
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread"] }
tokio-util = "0.7"
getrandom = "0.3"
# The types that cross to the window derive `specta::Type`; the bindings
# themselves are generated by the app crate.
specta = { version = "=2.0.0-rc.26", features = ["derive"] }

# Waiting on a capture's file descriptor (net/capture.rs); the netlink
# socket (route/netlink.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Raw ICMP sockets for ping and traceroute (route/icmp.rs). Already in the
# tree through tokio.
[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(windows)'.dependencies]
ferrisetw = "1.2"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Threading",
] }
